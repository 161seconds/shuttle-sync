services:
  mongodb:
    image: mongo:8
    container_name: shuttlesync_mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server.Dockerfile
    container_name: shuttlesync_server
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - ASPNETCORE_ENVIRONMENT=Production
      - MONGO_URI=mongodb://mongodb:27017/badminton_db?replicaSet=rs0
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET to a random secret of at least 32 characters}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET to a different random secret of at least 32 characters}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      - SEPAY_WEBHOOK_SECRET=${SEPAY_WEBHOOK_SECRET:-}
      - SEPAY_API_TOKEN=${SEPAY_API_TOKEN:-}
      - SEPAY_ACCOUNT_NUMBER=${SEPAY_ACCOUNT_NUMBER:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        - NEXT_PUBLIC_SEPAY_BANK_ID=${NEXT_PUBLIC_SEPAY_BANK_ID:-MBBank}
        - NEXT_PUBLIC_SEPAY_BANK_ACC=${SEPAY_ACCOUNT_NUMBER:-}
        - NEXT_PUBLIC_SEPAY_BANK_HOLDER=${NEXT_PUBLIC_SEPAY_BANK_HOLDER:-}
        - NEXT_PUBLIC_VIETMAP_KEY=${NEXT_PUBLIC_VIETMAP_KEY:-}
    container_name: shuttlesync_client
    ports:
      - "${CLIENT_PORT:-80}:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
