name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install root dependencies
      run: npm ci || npm install

    - name: Setup and Build Shared
      run: |
        cd shared
        npm install
        npm run build

    - name: Setup and Build Client
      run: |
        cd client
        npm install
        npm run build

    - name: Setup and Build Server
      run: |
        cd server
        npm install
        npm run build
